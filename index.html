<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Static Presentation Template</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="presentation" aria-live="polite">
      <section class="slide is-active" data-slide>
        <h1>Static Presentation Template</h1>
        <p>Build simple, interactive, single-page HTML presentations.</p>
      </section>

      <section class="slide" data-slide>
        <h2>How to use</h2>
        <ul>
          <li>Duplicate slides as needed</li>
          <li>Customize styles in <code>css/style.css</code></li>
          <li>Extend behavior in <code>js/presentation.js</code></li>
        </ul>
      </section>

      <section class="slide" data-slide>
        <h2>Navigation</h2>
        <p>Use Previous/Next buttons or arrow keys to move between slides.</p>
      </section>
    </main>

    <nav class="controls" aria-label="Presentation controls">
      <button type="button" data-action="prev">Previous</button>
      <span class="counter" data-counter>1 / 3</span>
      <button type="button" data-action="next">Next</button>
    </nav>

    <script src="js/presentation.js"></script>
  </body>
</html>
